name: Production Deployment

on:
  workflow_dispatch:

jobs:
  build_and_deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate image tags
        id: generate-tags
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Setup Docker
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push monolithic image
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ajrasakha-app:production
            ${{ secrets.DOCKERHUB_USERNAME }}/ajrasakha-app:production-${{ steps.generate-tags.outputs.short_sha }}

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ajrasakha \
            --image ${{ secrets.DOCKERHUB_USERNAME }}/ajrasakha-app:production-${{ steps.generate-tags.outputs.short_sha }} \
            --region asia-south2 \
            --platform managed \
            --memory 512Mi \
            --cpu 1 \
            --port 3000 \
            --set-env-vars NODE_ENV=production \
            --strategy=merge \
            --allow-unauthenticated
