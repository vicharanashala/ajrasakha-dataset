version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        - VITE_API_URL=http://localhost:3000
    container_name: ajrasakha-app
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
      - MONGODB_URI=${MONGODB_URI:-mongodb+srv://lpulga167_db_user:AlYI819Ba8Md1ly7@chatbot.icehz1c.mongodb.net?appName=chatbot}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-agriai}
      - PORT=3000
      - CORS_ORIGINS=http://localhost:3000
      - GOOGLE_AUTH_ENABLED=${GOOGLE_AUTH_ENABLED:-false}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-your-email@gmail.com}
      - SMTP_PASS=${SMTP_PASS:-your-app-password}
      - SMTP_FROM=${SMTP_FROM:-Ajrasakha Dataset <noreply@ajrasakha.com>}
    networks:
      - ajrasakha-network
    restart: unless-stopped

networks:
  ajrasakha-network:
    driver: bridge